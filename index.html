var MONTHS=["Dezember","Januar","Februar","März","April","Mai","Juni","Juli","August","September"];
var LETTERS=[
{name:"Sarah",song:"",artist:"",url:"",text:"Liebe (Ex)-Arbeits - Ehefrau ❤️\n\nManche Begegnungen sind einfach etwas ganz Besonderes … ❤️\n\nUnsere Wege haben sich das erste Mal während der OE gekreuzt, im Paranoia haben wir uns dann richtig kennengelernt und in der Grundschule Archenholzstraße habe ich dich schließlich so richtig lieb gewonnen.\n\nEs war eine unglaublich intensive, bewegende und prägende Zeit, die ich auf keinen Fall missen möchte. Eine Zeit voller gemeinsamer Erlebnisse, Herausforderungen, Gespräche und unvergesslicher Momente.\n\nIch möchte dir von Herzen Danke sagen. Danke für deine lieben und aufmunternden Worte, für deine Wertschätzung, deine Unterstützung und all die kleinen und großen Gesten, die so viel bedeutet haben. Danke, dass du einfach du bist!\n\nIch bin unendlich froh und dankbar, dass das Leben unsere Wege zusammengeführt hat. Manche Menschen hinterlassen Spuren im Herzen – und du gehörst für mich definitiv dazu!\n\nSchön, dass es dich gibt und dass du ein Teil meines Lebens geworden bist! ❤️\n\nHappy Birthday liebe Freundin! 🫶🏻",open:false},
{name:"Sabrina",song:"Felices los 4",artist:"Maluma",url:"https://open.spotify.com/track/1RouRzlg8OKFeqc6LvdxmB",text:"Hola hermanita, hier ist deine große Schwester. ❤️\n\nEndlich hast du es geschafft! Du hast einen so wichtigen Meilenstein in deinem Leben erreicht und hältst nun endlich dein Diplom in den Händen. Ist dir eigentlich bewusst, dass du bald einen Master in der Hand halten wirst? Wenn man darüber nachdenkt, ist das einfach unglaublich!\n\nIch weiß, dass die letzte Etappe noch vor dir liegt und dass es noch nicht ganz vorbei ist. Aber wenn ich eines weiß, dann, dass du alles schaffen kannst, was du dir vornimmst. Du warst schon immer eine unglaublich ehrgeizige, fleißige und zielstrebige Frau. Du hast nie aufgehört, an dich und deinen Weg zu glauben, und heute siehst du, dass sich all die Mühe, die Arbeit und die Ausdauer gelohnt haben.\n\nDu bist eine Inspiration für mich. Eine starke Frau, die ihre Träume verfolgt, ihren eigenen Weg geht und sich von nichts aufhalten lässt. Ich bin unglaublich stolz auf dich und bin schon jetzt so neugierig darauf, was du eines Tages beruflich machen wirst, welchen Weg du einschlagen und wohin dich das Leben führen wird. Aber egal, welche Entscheidungen du triffst, ich bin mir sicher, dass du deinen richtigen Weg finden wirst. Vertraue weiterhin auf dich selbst, denn du hast so viel Potenzial in dir.\n\nAuch wenn ich heute vielleicht nicht persönlich bei dir sein kann, um dich ganz fest in den Arm zu nehmen, dir zu gratulieren und diesen besonderen Moment mit dir zu feiern, sollst du wissen, dass ich in Gedanken bei dir bin.\n\nDu hast einen ganz besonderen Platz in meinem Herzen, meine hermanita. Auch wenn uns manchmal die Entfernung trennt, bin ich immer an deiner Seite, auf meine eigene Weise. Ich wünsche dir von Herzen, dass du weiterhin deinen Träumen folgst, glücklich bist und all das erreichst, was du dir für dein Leben wünschst.\n\nIch freue mich unendlich darauf, dich ganz, ganz bald wiederzusehen und dich dann persönlich in den Arm zu nehmen.\n\nTe quiero mucho, hermanita. ❤️",open:false},
{name:"Eli",song:"",artist:"",url:"",text:`Liebe Sara,\nDu weißt vielleicht, dass ich nicht der beste Mensch bin, was das Schreiben von Briefen angeht. Ich habe mir sehr lange Gedanken darüber gemacht, was ich Dir schreiben will (ohne mich zu sehr zu wiederholen).\nIch möchte gerne erstmal danke sagen. Danke, dass Du mich vor zwei Jahren mit offenen Armen im FSR aufgenommen hast! Ich will mir nicht ausmalen, wo ich heute wäre, wenn Du mich nicht nach der Sitzung mit ins Queer-Ref mitgeschleppt hättest und wir zum ersten Mal zu viert nach einer Sitzung uns unterhalten haben.\nUnd danke, dass Du Bene und mich mit auf die BuFaTa nach Wuppertal geschleppt hast. Beides habe ich sehr gerne in Erinnerung.\nDie letzten zwei Jahre mit Dir habe ich sehr genossen! Die gemeinsame Planung der BuFaTa in Hamburg, die diversen (und teilweise viel zu langen) Sitzungen, die ganzen Insider, der gemeinsame „Kurz-Urlaub“ in Dortmund/Köln/Brühl, die BuFaTa in Landau und nicht zuletzt der Sommer dieses Jahr mit dem Landau-Urlaub und dem Dockville. Ich freue mich auf die nächsten Jahre mit Dir!\nDanke für Dein immer offenes Ohr und Deine Unterstützung im letzten Jahr! Du bist mir sehr ans Herz gewachsen. Alles Liebe zum Bachelor, sei stolz auf Dich! Feier Dich, Du hast es mehr als verdient.\nUnd wenn’s mal schwer ist, vergiss nicht, was Oidorno gesungen haben:\n{{L1}}\nUnd was Kraftklub singen:\n{{L2}}\nEgal, was ist, ich bin gerne da und immer erreichbar (egal ob mit feuchter oder trockener Seite)\nAlles Liebe und lass es Dir gut gehen!`,open:false},

{name:"Vanessa",song:"Aufwachsen mit Sara",artist:"",btn:"Playlist anhören",url:"https://open.spotify.com/playlist/0PeMf9xc9kzGqa3P2944K3",text:"Meine liebe Schwester,\n\n2017 hast du eine Reise begonnen, von der du wahrscheinlich selbst nicht wusstest, wie lange sie dauern, wie viel Kraft sie dich kosten und wie sehr sie dich verändern würde.\n\nUnd heute, im Oktober 2026, darf ich endlich sagen: Du hast es geschafft. Du bist Bachelorabsolventin!\n\nNeun Jahre. Neun Jahre voller Leben, Veränderungen, Herausforderungen, Entscheidungen und bestimmt auch Momenten, in denen du dich gefragt hast, ob du jemals an diesem Punkt ankommen würdest.\n\nAber du bist angekommen.\n\nUnd ich hoffe, dass du heute nicht nur auf das Stück Papier schaust, das du dir verdient hast, sondern auch auf die Frau, die du auf dem Weg dorthin geworden bist.\n\nWeißt du, für mich warst du nie einfach nur meine große Schwester.\n\nDu warst meine zweite Mama. Mein Vorbild. Jemand, der auf mich aufgepasst hat, lange bevor ich überhaupt verstehen konnte, was es bedeutet, Verantwortung für einen anderen Menschen zu übernehmen.\n\nWährend andere einfach nur eine große Schwester hatten, hatte ich jemanden, der sich gekümmert hat, der mitgedacht hat und der für mich da war.\n\nUnd vielleicht habe ich dir das viel zu selten gesagt, aber ich habe nie vergessen, was du für mich getan hast.\n\nDas Leben hat uns beide auf unterschiedliche Wege geführt. Und trotzdem gab es Dinge, die uns immer miteinander verbunden haben. Allen voran unsere Familie.\n\nWir beide haben uns um Oma und Opa gekümmert. Wir haben Verantwortung übernommen, waren für sie da und haben versucht, ihnen so viel Liebe und Geborgenheit zurückzugeben, wie sie uns über all die Jahre geschenkt haben.\n\nBesonders ihr letztes Lebensjahr, in dem ich sie gepflegt und bis zum Schluss begleitet habe, hat mir noch einmal gezeigt, wie kostbar gemeinsame Zeit ist. Wie viel Liebe in den kleinen Dingen steckt und wie wichtig es ist, füreinander da zu sein.\n\nUnd wenn ich heute an deinen Abschluss denke, denke ich unweigerlich auch an die beiden.\n\nWie schön wäre es, wenn sie diesen Moment noch mit uns erleben könnten. Wenn sie sehen könnten, was du erreicht hast. Wenn sie dich in den Arm nehmen und dir sagen könnten, wie stolz sie auf dich sind.\n\nIch kann nicht für sie sprechen, aber ich glaube von ganzem Herzen, dass sie sich unendlich für dich freuen würden.\n\nVielleicht fehlen sie gerade an solchen Tagen besonders. An Tagen, an denen das Leben uns etwas Wunderschönes schenkt und wir uns wünschen, dass alle Menschen, die wir lieben, dabei sein könnten.\n\nAber ich glaube auch, dass ein Teil von ihnen immer bei uns bleibt. In unseren Erinnerungen, in unseren Herzen und in der Art, wie wir füreinander da sind.\n\nUnd deshalb gehört ein kleines Stück dieses besonderen Tages auch ihnen.\n\nDein Abschluss ist nicht nur das Ende eines Studiums. Er ist der Beweis dafür, dass es im Leben nicht darauf ankommt, wie schnell wir unser Ziel erreichen, sondern darauf, dass wir unseren Weg nicht aufgeben.\n\nDu hast dir Zeit genommen. Du hast gelebt. Du hast weitergemacht. Und heute stehst du hier, mit einem Abschluss, den dir niemand mehr nehmen kann.\n\nIch wünsche mir, dass du dich heute einmal mit meinen Augen sehen könntest.\n\nNicht nur als die Frau, die gerade ihren Bachelor bestanden hat, sondern als die große Schwester, zu der ich mein ganzes Leben aufgeschaut habe.\n\nAls die Frau, die mir schon so viel gegeben hat, bevor sie überhaupt wusste, wie viel das einmal für mich bedeuten würde.\n\nUnd als die Frau, die trotz allem ihren eigenen Weg gegangen ist.\n\nIch weiß, dass wir nicht immer einer Meinung sind. Dass wir uns manchmal auf die Nerven gehen und dass wir beide unsere ganz eigenen Köpfe haben.\n\nAber eines sollst du niemals vergessen:\n\nEgal, wie alt wir werden, egal, wie weit uns das Leben voneinander entfernt oder wie sehr sich unsere Wege verändern – du wirst immer meine große Schwester sein. Mein erstes Vorbild. Meine zweite Mama. Und einer der wichtigsten Menschen in meinem Leben.\n\nIch bin unglaublich stolz auf dich.\n\nNicht erst seit heute. Nicht erst, weil du einen Bachelor hast.\n\nSondern schon mein ganzes Leben lang.\n\nUnd wenn du irgendwann wieder an dir zweifelst, dann hol diesen Brief heraus und erinnere dich daran, was du alles geschafft hast.\n\n2017 hast du angefangen.\n\n2026 hast du es geschafft.\n\nUnd ich hoffe, du weißt, dass noch so viele wunderschöne Kapitel auf dich warten.\n\nHerzlichen Glückwunsch, meine große Schwester. Du hast dir diesen Moment verdient.\n\nIch liebe dich. Mehr, als ich dir manchmal zeigen oder sagen kann.\n\nFür immer deine kleine Schwester.",open:false},
{name:"Gigi",song:"Memories ❤️",artist:"",btn:"Playlist anhören",url:"https://open.spotify.com/playlist/3jMfeas89qahv7C9vH35bT",text:"Liebe Sara,\n\nich sitze hier wie eine stolze Mama und weiß gar nicht, wo ich anfangen soll. Du hast es geschafft. Dein Bachelor gehört dir, endlich! Ich bin so unfassbar stolz auf dich, dass mir fast die Worte fehlen. Ich habe gesehen, wie viel Kraft, Nerven, vor allem Zeit und auch Tränen darin stecken, und trotzdem hast du nie aufgegeben. Das ist so typisch du, und genau dafür bewundere ich dich.\n\nWeißt du, was mir in letzter Zeit immer wieder bewusst wird? Wie glücklich ich bin, dich in meinem Leben zu haben. Du bist für mich keine Freundin, du bist meine Schwester, nur eben die, die ich mir selbst ausgesucht habe. Du bist Familie. Und ich weiß, dass ich mich immer, wirklich immer auf dich verlassen kann. Genauso wie du dich immer auf mich verlassen kannst, egal wann, egal wie spät, egal was ist.\n\nUnd trotz all der großen Worte muss ich beim Schreiben grinsen, weil mir einfällt: „Wer mit solchen Füßen ins Bett geht, beobachtet auch seinen Vater beim Duschen.“ Dieser Spruch wird uns wohl auf ewig begleiten, genauso wie die Frage: „Siehst du die Rehe?“ Oder mein persönlicher Favorit: „Ich bin eine Meereskatze!“ Mit niemandem sonst kann ich so herzhaft über solch dumme Sachen lachen wie mit dir.\n\nIch hoffe so sehr, dass wir für immer befreundet bleiben, dass wir irgendwann als alte Damen zusammen lachen und uns an all das erinnern. Du hast einen ganz besonderen Platz in meinem Herzen, einen, der nur dir gehört und der dir immer bleibt.\n\nIch liebe dich unendlich doll, Sara. Danke, dass es dich gibt.",open:false},
{name:"Laurin",song:"Ponyhof",artist:"Mariybu",url:"https://open.spotify.com/track/17RvndgsVO7lqqfGyQ10rA",text:"Liebe Sara,\nerst einmal herzlichen Glückwunsch zu diesem Erfolg! Ich finde, eine Bachelorarbeit zu schreiben und dann (demnächst) seinen Bachelor abzuschließen, ist schon ein großer Erfolg! Das Ganze noch mit all dem zu schaffen, was du während deinem Studium erlebt hast, macht den Erfolg noch größer. Ich weiß, dass du und wir im FSR deine Studienzeit manchmal als kleinen Running Gag haben, aber ganz ehrlich. Ein Studium 9 Jahre lang durchzuziehen und nicht abzubrechen, dabei den Verlust der wichtigsten Menschen zu verarbeiten, selbst viel zu arbeiten, sich dauerhaft für bessere Lehre und Studienbedingungen stark zu machen, fucking Corona durchzustehen und dann einfach noch OE-Alleskönnerin zu sein. Einfach nur wirklich unglaublich das zu schaffen. Slay Queen, 67 und alles andere, was wir immer so babbeln, noch obendrauf als Anerkennung. Also herzlichen Glückwunsch da nochmal, Sarini Masterini.\nJetzt nochmal zum persönlichen Teil. Liebe Sara, ich verdanke dir so vieles. Dadurch, dass du meine OE-Tutorin warst, hatte ich schon einen guten Start in die Uni. Meine Zeit in der Uni wurde aber vor allem durch deine Anregungen, sich im Paranoia zu engagieren, eine besondere. Weekend Techno Madness (du warst bei der ersten mit Aaron dabei) und es sind danach auch nicht wirklich mehr Leute gekommen, aber einmal immerhin 30 (da hatte es Ravecharakter) und Para the Gathering (wo wir mittlerweile 80 Leute in der Gruppe sind und regelmäßig 12-16 Leute zum Spielen kommen) wären ohne deine Überzeugung, sich für ein gutes Miteinander in der Uni einzusetzen, nicht entstanden. Auch hätte ich so viele Gespräche und Freundschaften mit so netten Menschen ohne dich wahrscheinlich nie geführt und ich denke, das geht ganz vielen Menschen so. Dass du so lange engagiert studierst, ist für den FSR, das Paranoia und auch die OE – ein wahnsinniger Gewinn! Also wirklich danke, Sara, dass du dir die Zeit nimmst und genommen hast.\nEs ist schön, durch den FSR wieder mehr Zeit mit dir zu verbringen und schöne Erinnerungen wie den Portugiesenbesuch mit anschließendem Festival zu schaffen. Ich freue mich sehr, diesen Meilenstein in deinem Leben mit dir feiern zu können und dir mit diesem Brief ein kleines persönliches Denkmal zu setzen.\nAlles Liebe",open:false},
{name:"Isabella",nosig:true,song:"",artist:"",url:"",text:"Liebe Sara,\nWir gratulieren dir von ganzem Herzen zu deiner bestandenen Bachelorarbeit!\nAls ich gehört habe, dass du es geschafft hast, habe ich mich unglaublich für dich gefreut. Aber dieser Meilenstein ist für uns als Familie natürlich etwas ganz Besonderes: Dass du ausgerechnet dein Patenkind, unseren kleinen Antoine, zum Thema deiner Arbeit gemacht hast, bedeutet mir mehr, als ich in Worte fassen kann.\nEs ist einfach wunderschön zu sehen, mit wie viel Liebe, Hingabe und Begeisterung du deine Rolle als Patentante lebst. Dass Antoine dich nicht nur im Alltag begleitet, sondern dich auch in deinem Studium inspirieren konnte, zeigt, was für ein einmaliges Band ihr zwei habt. Er kann wirklich stolz darauf sein, eine so kluge, engagierte und liebevolle Patentante an seiner Seite zu haben!\nDu hast so viel Zeit, Energie und Herzblut in diese Arbeit gesteckt, und dieser Erfolg gehört ganz alleine dir. Ich hoffe, du feierst diesen besonderen Moment ordentlich und bist richtig stolz auf dich – wir sind es auf jeden Fall!\nDanke für alles, was du für Antoine und unsere Familie tust. Für deine berufliche und persönliche Zukunft wünsche ich dir von Herzen nur das Allerbeste!\nFühl dich ganz fest gedrückt,\nAntoine, Lamin und Chave\n\nPS: Für deinen Master-Abschluss machst du auch mit links 🥰🙌🏻",open:false},
{name:"Damaris",song:"Denkmal",artist:"Wir sind Helden",url:"https://open.spotify.com/track/58zHoX9U5VlSXLUUmWTfe2",text:"Liebe Sara, ich möchte dir ganz herzlich zu deinem Bachelor gratulieren! Ich bin wahnsinnig stolz auf dich und du kannst es auch sein. Einen Studienabschluss zu machen, ist an sich schon eine tolle Sache, aber wenn ich an alles denke, was bei dir so die letzten Jahre los war und welche Hürden du überwinden musstest, bin ich umso mehr froh, dass du das trotzdem alles geschafft und durchgezogen hast. Neben einer 70%-Stelle, Familiengeschichten und allem weiteren, trotzdem dranzubleiben und gleichzeitig noch so aktiv in der Uni zu sein, ist wirklich nicht selbstverständlich. Ich bin fest davon überzeugt, dass der Beruf als Sonderpädagogin perfekt zu dir passt und du mit deiner Art, deiner Haltung und deinem Einsatz für andere genau an der richtigen Stelle bist und sein wirst. Auch deshalb bin ich sehr froh, dass du durchgezogen hast. Wir haben zwar inzwischen gelernt, dass es einem mit einem Bachelorabschluss auch nicht besser geht, aber ich freu mich trotzdem mega für dich! ;)\n\nIch möchte die Gelegenheit außerdem nutzen, um dir zu sagen, wie froh und dankbar ich bin, dass ich dich im Studium kennenlernen durfte. Ich erinnere mich noch ganz genau daran, wie ich dich damals in meiner Corona-OE zum ersten Mal auf Zoom gesehen habe, als du den FSR vorgestellt hast. Damals warst du mir direkt sympathisch und auch ein Vorbild für mich, weil du schon länger studiert hast und genau wusstest, wie alles läuft. In unserer ersten gemeinsamen OE waren wir uns zwar noch etwas fremd, aber du hast auch da schon maßgeblich dazu beigetragen, dass ich im Para und im FSR gelandet und auch weiter in der OE geblieben bin. Du bist dadurch für mich einer der Gründe dafür, dass ich in der Uni so gut angekommen bin, und dafür bin ich dir nach wie vor sehr dankbar.\n\nWas mich aber noch viel glücklicher macht, ist, dass du für mich über diese gemeinsame Zeit zu so einer wichtigen Person geworden bist. Durch unsere gemeinsamen BuFaTen, die BuFaTa-Orga und die diversen OE-Zyklen habe ich dich so unfassbar liebgewonnen. Deine Schlagfertigkeit und deinen Mut, Dinge einfach mal so zu benennen, wie sie sind und wie du für deine Herzensmenschen einstehst, möchte ich wirklich nicht mehr missen. Gleichzeitig schätze ich total, dass man sich mit dir sowohl kaputtlachen und abfucken kann, du aber auch immer ein offenes Ohr hast, wenn was ist. Ohne dich wäre meine Unizeit einfach nicht das, was sie ist, und ich hab durch dich sehr viele lustige Erinnerungen sammeln können, die komischerweise viel mit stinkigen Menschen und Pisse zu tun haben: „Leute, mein Moia kommt“, der Pisseimer, das Kackhandtuch, Gestank im OE-Plenum, „Wie groß sind eure Füße so“, ... \n\nIch wünsche dir von Herzen alles Gute für dein weiteres Studium und natürlich allem, was darüber hinaus noch auf dich wartet! Und ich wünsche dir, dass du immer wieder siehst, wie viel du schon geschafft hast und wie stolz du darauf sein kannst! Vor allem aber hoffe ich auch, dass du mir auch unabhängig von Uni, FSR, OE und allem anderen noch lange als Freundin erhalten bleibst. Hab dich lieb!",open:false},
{name:"Nina",song:"Danza Kuduro",artist:"Don Omar & Lucenzo",url:"https://open.spotify.com/track/0rCxlp7KdpW1JR8uG6Uno0",text:"Liebe Sara,\n\nerstmal Happy Birthday und congrats zum Bachelor!! ❤️ Nach neun Jahren hast du es endlich geschafft und ich freue mich unfassbar für dich!\n\nWenn ich an uns denke, muss ich direkt an unsere Café-Sul-Zeit denken. Die unzähligen Schichten, diese gottlosen Champions-League-Abende und natürlich unsere wohlverdienten Feierabendbierchen. Honestly, what a time! 😂\n\nWas ich an dir besonders bewundere, ist dein Durchhaltevermögen. Du hast in den letzten Jahren so viel gleichzeitig gestemmt, so manche Hürde überwunden und trotzdem nie aufgegeben. Ich erkenne mich in vielen Dingen selbst in dir wieder und finde deinen Weg deshalb umso inspirierender. You did it, Girl! ❤️\n\nDu bist einfach eine unglaublich tolle und loyale Freundin. Auch wenn wir uns mal drei Monate nicht sehen, können wir danach problemlos zehn Stunden quatschen, als wäre nichts gewesen. And that’s what I call real friendship!\n\nIch bin so froh, dich in meinem Leben zu haben, und wünsche dir für deine Dirty Thirties nur das Allerbeste. Du hast es dir mehr als verdient! ❤️\n\nUnser Song: Danza Kuduro, weil manche Freundschaften durch gemeinsame Interessen entstehen und unsere durch gemeinsame Café-Sul-Traumata gefestigt wurde.. 😂\n\nHab dich lieb! ❤️",open:false}
